<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Lies a receiver accepts</title>
<desc id="d">Lie benchmark. Plain A2A accepts 712 of 712 lies, a sender-signature check 643 of 712; models of real protocols: A2A 1.0 with a signed card 712, uAgents 702, RFC 9421 with replay checks 682, SCITT receipts 550, Verifiable Intent 509, AP2 mandates 504; PCM 0.1 10 of 712, all stale evidence.</desc>
<text x="0" y="26" font-size="18" font-weight="600" fill="#f2f1ec">Lies a receiver accepts</text>
<text x="0" y="48" font-size="13" fill="#c3c2b7">Lie benchmark: false claims accepted as true, of 712 lies. Lower is better.</text>
