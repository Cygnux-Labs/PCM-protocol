<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Lies a receiver accepts</title>
<desc id="d">PCM-Lies benchmark. Plain A2A accepts 712 of 712 lies, a sender-signature check 643 of 712, PCM 0.1 before the fixes 23 of 687, and PCM 0.1 10 of 712, all stale evidence.</desc>
<text x="0" y="26" font-size="18" font-weight="600" fill="#0b0b0b">Lies a receiver accepts</text>
<text x="0" y="48" font-size="13" fill="#52514e">PCM-Lies benchmark: false claims accepted as true, of 712 lies (687 before the fixes). Lower is better.</text>
<line x1="220.0" y1="78" x2="220.0" y2="244" stroke="#d9d8d2" stroke-width="1"/>
<text x="220.0" y="262" font-size="11" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">0%</text>
<line x1="310.0" y1="78" x2="310.0" y2="244" stroke="#d9d8d2" stroke-width="1"/>
<text x="310.0" y="262" font-size="11" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">25%</text>
<line x1="400.0" y1="78" x2="400.0" y2="244" stroke="#d9d8d2" stroke-width="1"/>
<text x="400.0" y="262" font-size="11" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">50%</text>
<line x1="490.0" y1="78" x2="490.0" y2="244" stroke="#d9d8d2" stroke-width="1"/>
<text x="490.0" y="262" font-size="11" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">75%</text>
<line x1="580.0" y1="78" x2="580.0" y2="244" stroke="#d9d8d2" stroke-width="1"/>
<text x="580.0" y="262" font-size="11" text-anchor="middle" fill="#52514e" style="font-variant-numeric: tabular-nums">100%</text>
<text x="208" y="107.0" font-size="13" text-anchor="end" fill="#0b0b0b">Plain A2A (no proof)</text>
<path d="M220,92 h356.00 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-356.00 z" fill="#eb6834"/>
<text x="588.0" y="107.0" font-size="12" fill="#0b0b0b" style="font-variant-numeric: tabular-nums"><tspan font-weight="600">100%</tspan><tspan fill="#52514e">  712 / 712</tspan></text>
<text x="208" y="147.0" font-size="13" text-anchor="end" fill="#0b0b0b">Sender's signature only</text>
<path d="M220,132 h321.11 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-321.11 z" fill="#eb6834"/>
<text x="553.1123595505618" y="147.0" font-size="12" fill="#0b0b0b" style="font-variant-numeric: tabular-nums"><tspan font-weight="600">90.3%</tspan><tspan fill="#52514e">  643 / 712</tspan></text>
<text x="208" y="187.0" font-size="13" text-anchor="end" fill="#0b0b0b">PCM 0.1, before the fixes</text>
<path d="M220,172 h8.05 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-8.05 z" fill="#2a78d6"/>
<text x="240.05240174672488" y="187.0" font-size="12" fill="#0b0b0b" style="font-variant-numeric: tabular-nums"><tspan font-weight="600">3.3%</tspan><tspan fill="#52514e">  23 / 687</tspan></text>
<text x="208" y="227.0" font-size="13" text-anchor="end" fill="#0b0b0b">PCM 0.1</text>
<path d="M220,212 h2.53 a2.528089887640449,2.528089887640449 0 0 1 2.528089887640449,2.528089887640449 v14.9438202247191 a2.528089887640449,2.528089887640449 0 0 1 -2.528089887640449,2.528089887640449 h-2.53 z" fill="#2a78d6"/>
<text x="233.0561797752809" y="227.0" font-size="12" fill="#0b0b0b" style="font-variant-numeric: tabular-nums"><tspan font-weight="600">1.4%</tspan><tspan fill="#52514e">  10 / 712 · all stale evidence, a stated limit</tspan></text>
<rect x="220" y="276" width="12" height="12" rx="3" fill="#eb6834"/>
<text x="238" y="286" font-size="12" fill="#52514e">baseline receivers</text>
