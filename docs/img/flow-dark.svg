<svg xmlns="http://www.w3.org/2000/svg" width="960" height="178" viewBox="0 0 960 178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How a PCM claim travels</title>
<desc id="d">Agent A acts through an attesting signer that records and signs every event; the signed message carries records and inclusion proofs; agent B checks them offline against a pinned key.</desc>
<defs><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d8c85"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2fa84f"/></marker><marker id="maybe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d79a1a"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e66767"/></marker></defs>
<rect x="1.0" y="44" width="158" height="76" rx="10" fill="#1f2328" stroke="#3a3a37" stroke-width="1.5"/>
<text x="80.0" y="78.0" font-size="14" font-weight="600" text-anchor="middle" fill="#f2f1ec">Agent A</text>
<text x="80.0" y="96.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">runs tests, fetches, asks</text>
<rect x="267.6666666666667" y="44" width="158" height="76" rx="10" fill="#1f2328" stroke="#3987e5" stroke-width="1.5"/>
<text x="346.6666666666667" y="69.0" font-size="14" font-weight="600" text-anchor="middle" fill="#f2f1ec">Attesting signer</text>
<text x="346.6666666666667" y="87.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">records and signs</text>
<text x="346.6666666666667" y="105.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">every event</text>
<rect x="534.3333333333334" y="44" width="158" height="76" rx="10" fill="#1f2328" stroke="#3a3a37" stroke-width="1.5"/>
<text x="613.3333333333334" y="69.0" font-size="14" font-weight="600" text-anchor="middle" fill="#f2f1ec">PCM message</text>
<text x="613.3333333333334" y="87.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">claims + records</text>
<text x="613.3333333333334" y="105.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">+ inclusion proofs</text>
<rect x="801.0" y="44" width="158" height="76" rx="10" fill="#1f2328" stroke="#3987e5" stroke-width="1.5"/>
<text x="880.0" y="69.0" font-size="14" font-weight="600" text-anchor="middle" fill="#f2f1ec">Agent B</text>
<text x="880.0" y="87.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">checks it offline</text>
<text x="880.0" y="105.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">against a pinned key</text>
<line x1="166.0" y1="82.0" x2="258.6666666666667" y2="82.0" stroke="#8d8c85" stroke-width="1.8" marker-end="url(#line)"/>
<text x="212.33333333333334" y="72.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">every tool call</text>
<line x1="432.6666666666667" y1="82.0" x2="525.3333333333334" y2="82.0" stroke="#8d8c85" stroke-width="1.8" marker-end="url(#line)"/>
<text x="479.0" y="72.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">signs the message</text>
<line x1="699.3333333333334" y1="82.0" x2="792.0" y2="82.0" stroke="#8d8c85" stroke-width="1.8" marker-end="url(#line)"/>
<text x="745.6666666666667" y="72.0" font-size="12" font-weight="400" text-anchor="middle" fill="#c3c2b7">A2A · MCP · HTTP</text>
<text x="346.6666666666667" y="30" font-size="12" font-weight="400" text-anchor="middle" fill="#3987e5">the agent never holds its key</text>
<text x="880.0" y="30" font-size="12" font-weight="400" text-anchor="middle" fill="#3987e5">no call to anyone</text>
<text x="704" y="156" font-size="12" font-weight="400" text-anchor="end" fill="#c3c2b7">each claim comes out</text>
<rect x="712.0" y="138" width="80" height="26" rx="13" fill="#2fa84f"/>
<text x="752" y="156" font-size="13" font-weight="600" text-anchor="middle" fill="#0d1117">proven</text>
<rect x="800.0" y="138" width="80" height="26" rx="13" fill="#d79a1a"/>
<text x="840" y="156" font-size="13" font-weight="600" text-anchor="middle" fill="#0d1117">unproven</text>
<rect x="888.0" y="138" width="70" height="26" rx="13" fill="#e66767"/>
<text x="923" y="156" font-size="13" font-weight="600" text-anchor="middle" fill="#0d1117">failed</text>
</svg>
